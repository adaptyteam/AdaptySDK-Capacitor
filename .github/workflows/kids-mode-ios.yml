name: Kids Mode (iOS)

on:
  workflow_dispatch:
  pull_request:
    branches: [ master, dev ]
    paths:
      - 'Package.swift'
      - 'scripts/kids-mode.cjs'
      - 'scripts/verify-kids-mode-ios.sh'
      - '.github/workflows/kids-mode-ios.yml'
      - 'ios/**'
      - 'examples/adapty-devtools/ios/**'

concurrency:
  group: kids-mode-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-kids-mode-ios:
    runs-on: macos-26
    name: Verify Kids Mode (iOS)
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Enable Corepack
        run: corepack enable || npm install -g yarn@1.22.19

      - name: Prepare Yarn
        run: |
          if command -v corepack > /dev/null 2>&1; then
            corepack prepare yarn@1.22.19 --activate
          fi

      - name: Install root dependencies
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Generate version file
        run: yarn update-versions

      - name: Install example dependencies
        working-directory: examples/adapty-devtools
        run: yarn install --prefer-offline --ignore-scripts

      # Non-interactive placeholder via the example's own generator (DRY). Also patches
      # pbxproj/gradle bundle id to com.example.plugin — harmless in an ephemeral unsigned build.
      - name: Create placeholder credentials
        working-directory: examples/adapty-devtools
        run: |
          node ../../scripts/credentials.mjs \
            --token=public_live_placeholder \
            --ios-bundle=com.example.plugin \
            --android-id=com.example.plugin \
            --placement-id=placeholder \
            --onboarding-placement-id=placeholder

      - name: Cache SPM checkouts
        uses: actions/cache@v4
        with:
          path: .spm-kids-mode
          key: kids-mode-spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: kids-mode-spm-${{ runner.os }}-

      - name: Verify Kids Mode (enabled -> AdSupport/IDFA must be absent)
        run: bash scripts/verify-kids-mode-ios.sh on
